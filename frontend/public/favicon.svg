<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1814" />
      <stop offset="100%" stop-color="#2D2319" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCDA68" />
      <stop offset="50%" stop-color="#D4A017" />
      <stop offset="100%" stop-color="#A2770E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />

  <g filter="url(#glow)">
    <!-- Stylized E-Book Pages -->
    <path d="M128 300 C176 284 224 296 256 316 C288 296 336 284 384 300 V156 C336 140 288 152 256 172 C224 152 176 140 128 156 Z" fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="256" y1="172" x2="256" y2="316" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" />

    <!-- Monogram MV -->
    <text x="256" y="420" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="76" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">MV</text>
  </g>
</svg>